<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART SCHOOL MANAGEMENT SYSTEM (SMIS)</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #0b1120;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #eab308;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-box h1 {
            font-size: 22px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-box p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* --- MAIN APP LAYOUT --- */
        #appLayout {
            display: none;
            min-height: 100vh;
            flex: 1;
        }
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
        }
        .brand {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
            padding: 0 10px 18px 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .brand span {
            display: block;
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 3px;
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s;
        }
        .nav-item:hover, .nav-item.active {
            background: #1e293b;
            color: var(--primary);
        }
        .badge-count {
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 12px;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .topbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .role-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .workspace {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
            color: var(--text-main);
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 14px;
            color: var(--primary);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13.5px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .btn {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover { background: var(--primary-hover); color: #fff; }
        .btn-success { background: var(--success); color: #052e16; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--accent); color: #000; }
        .btn-sm { padding: 5px 10px; font-size: 11.5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--bg-dark);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
        }
        .status-pill {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .st-pending { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .st-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. SECURE LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>SMART SCHOOL SMIS</h1>
            <p class="subtitle">Secure Login & Authorization Gateway</p>

            <label>Select User Role</label>
            <select id="loginRole">
                <option value="SUPER_ADMIN">SUPER ADMIN</option>
                <option value="HEADMASTER">HEADMASTER / PRINCIPAL</option>
                <option value="ACADEMIC_MASTER">ACADEMIC MASTER</option>
                <option value="ACCOUNTANT">ACCOUNTANT</option>
                <option value="TEACHER">TEACHER</option>
                <option value="HR_OFFICER">HR OFFICER</option>
                <option value="PARENT_STUDENT">PARENT / STUDENT PORTAL</option>
            </select>

            <label>Username</label>
            <input type="text" id="loginUsername" value="Suleiman Salum" placeholder="Enter username">

            <label>Security Password</label>
            <input type="password" id="loginPassword" value="admin123" placeholder="Enter password">

            <button class="btn" style="width: 100%; margin-top: 8px;" onclick="handleLogin()">Secure Login</button>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 14px; text-align: center;">
                🔒 Protected by Role-Based Access Control & Password Verification.
            </p>
        </div>
    </div>

    <!-- 2. MAIN APP WORKSPACE -->
    <div id="appLayout">
        <aside class="sidebar">
            <div class="brand">
                🎓 SMART SMIS
                <span id="sidebarRoleLabel">SUPER ADMIN</span>
            </div>
            <div class="nav-list" id="navMenu"></div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div style="font-weight: 700; font-size: 15px;" id="activeModuleTitle">Dashboard</div>
                <div class="user-pill">
                    <span id="loggedUserDisplay">User</span>
                    <span class="role-tag" id="loggedRoleBadge">ROLE</span>
                    <button class="btn btn-danger btn-sm" onclick="handleLogout()">Secure Logout</button>
                </div>
            </header>

            <div class="workspace" id="workspaceContent"></div>
        </div>
    </div>

    <script>
        // --- PASSWORDS & SECURITY DATABASE ---
        let authDatabase = JSON.parse(localStorage.getItem('smart_smis_auth')) || {
            SUPER_ADMIN: 'admin123',
            HEADMASTER: 'head123',
            ACADEMIC_MASTER: 'academic123',
            ACCOUNTANT: 'acc123',
            TEACHER: 'teach123',
            HR_OFFICER: 'hr123',
            PARENT_STUDENT: 'student123'
        };

        const ROLE_PERMISSIONS = {
            SUPER_ADMIN: ['dashboard', 'students', 'academics', 'exams', 'finance', 'attendance', 'hr', 'security', 'audit'],
            HEADMASTER: ['dashboard', 'students', 'academics', 'exams', 'finance', 'attendance', 'hr', 'security', 'audit'],
            ACADEMIC_MASTER: ['dashboard', 'students', 'academics', 'exams', 'attendance', 'security'],
            ACCOUNTANT: ['dashboard', 'students', 'finance', 'security'],
            TEACHER: ['dashboard', 'academics', 'exams', 'attendance', 'security'],
            HR_OFFICER: ['dashboard', 'hr', 'attendance', 'security'],
            PARENT_STUDENT: ['portal', 'security']
        };

        const MODULE_LABELS = {
            dashboard: '📊 Dashboard & Analytics',
            students: '👨‍🎓 Student Management',
            academics: '📚 Academics & Timetable',
            exams: '📝 Exams & Results',
            finance: '💰 Finance & Accounting',
            attendance: '✅ Attendance Tracking',
            hr: '👔 Human Resources',
            security: '🔒 Security & Privacy (Passwords)',
            portal: '👪 Parent & Student Portal',
            audit: '🛡️ Audit Trail Logs'
        };

        let db = JSON.parse(localStorage.getItem('smart_smis_db')) || {
            students: [
                { regNo: 'SMIS-2026-001', name: 'Asha Salum Ali', class: 'Form 4A', guardian: 'Salum Ali', status: 'Active', feeTotal: 500000, feePaid: 350000 }
            ],
            exams: [
                { studentReg: 'SMIS-2026-001', studentName: 'Asha Salum Ali', subject: 'Accountancy', score: 88, grade: 'A', status: 'Published' }
            ],
            auditLogs: [
                { time: '2026-11-17 08:00', user: 'System', role: 'SUPER_ADMIN', action: 'System Secured & Initialized' }
            ]
        };

        let session = { user: '', role: '' };

        function saveDB() {
            localStorage.setItem('smart_smis_db', JSON.stringify(db));
            localStorage.setItem('smart_smis_auth', JSON.stringify(authDatabase));
        }

        function logAudit(action) {
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            db.auditLogs.unshift({ time: now, user: session.user, role: session.role, action });
            saveDB();
        }

        // --- AUTHENTICATION & SECURITY LOGIC ---
        function handleLogin() {
            const role = document.getElementById('loginRole').value;
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (!user) { alert('Please enter username.'); return; }
            
            // Verify password security check
            if (authDatabase[role] !== pass) {
                alert('Access Denied: Incorrect Password for this Role!');
                return;
            }

            session = { user, role };
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appLayout').style.display = 'flex';
            document.getElementById('sidebarRoleLabel').innerText = role.replace('_', ' ');
            document.getElementById('loggedUserDisplay').innerText = user;
            document.getElementById('loggedRoleBadge').innerText = role.replace('_', ' ');

            logAudit(`Securely logged into system`);
            buildMenu();
        }

        function handleLogout() {
            logAudit(`Logged out`);
            document.getElementById('appLayout').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        function buildMenu() {
            const allowed = ROLE_PERMISSIONS[session.role] || ['dashboard', 'security'];
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';

            allowed.forEach((modKey, idx) => {
                const item = document.createElement('div');
                item.className = `nav-item ${idx === 0 ? 'active' : ''}`;
                item.innerHTML = `<span>${MODULE_LABELS[modKey]}</span>`;
                item.onclick = () => {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    renderModule(modKey);
                };
                nav.appendChild(item);
            });
            renderModule(allowed[0]);
        }

        // --- RENDER MODULES INCLUDING SECURITY & PRIVACY ---
        function renderModule(mod) {
            document.getElementById('activeModuleTitle').innerText = MODULE_LABELS[mod];
            const ws = document.getElementById('workspaceContent');

            if (mod === 'security') {
                ws.innerHTML = `
                    <div class="card" style="max-width: 500px;">
                        <h3>🔒 Security & Privacy Settings</h3>
                        <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">
                            Manage account security, change role passwords, and restrict unauthorized access to confidential school data.
                        </p>
                        
                        <label>Target Role to Update Password</label>
                        <select id="secRole">
                            <option value="${session.role}">${session.role} (Current Role)</option>
                            ${session.role === 'SUPER_ADMIN' ? Object.keys(authDatabase).map(r => `<option value="${r}">${r}</option>`).join('') : ''}
                        </select>

                        <label>New Secure Password</label>
                        <input type="password" id="newPass" placeholder="Enter new strong password">

                        <button class="btn btn-success" onclick="updatePassword()">Update Password Securely</button>
                    </div>

                    <div class="card">
                        <h3>🛡️ Privacy Compliance & Access Control</h3>
                        <p style="font-size:13px; color:var(--text-muted);">
                            This system enforces strict Role-Based Access Control (RBAC). Unauthenticated users cannot view student financials, exam scores, or staff payroll records.
                        </p>
                    </div>
                `;
            } else if (mod === 'dashboard') {
                ws.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="label">Total Students</div><div class="value" style="color:var(--primary);">${db.students.length}</div></div>
                        <div class="stat-card"><div class="label">Security Status</div><div class="value" style="color:var(--success);">Protected</div></div>
                    </div>
                    <div class="card">
                        <h3>Welcome to Smart SMIS, ${session.user}</h3>
                        <p style="color:var(--text-muted); font-size:13px;">You are securely logged in under role: <strong>${session.role}</strong>.</p>
                    </div>
                `;
            } else {
                ws.innerHTML = `<div class="card"><h3>${MODULE_LABELS[mod]}</h3><p style="color:var(--text-muted);">Module active and secured under ${session.role} permissions.</p></div>`;
            }
        }

        function updatePassword() {
            const role = document.getElementById('secRole').value;
            const newPass = document.getElementById('newPass').value.trim();
            if (!newPass || newPass.length < 5) { alert('Password must be at least 5 characters long.'); return; }

            authDatabase[role] = newPass;
            saveDB();
            logAudit(`Changed security password for role: ${role}`);
            alert('Password updated successfully! Next login will require this new password.');
            document.getElementById('newPass').value = '';
        }
    </script>
</body>
</html>
