<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART SCHOOL MANAGEMENT SYSTEM (SMIS)</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #0b1120;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #eab308;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-box h1 {
            font-size: 22px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-box p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* --- MAIN APP LAYOUT --- */
        #appLayout {
            display: none;
            min-height: 100vh;
            flex: 1;
        }
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
        }
        .brand {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
            padding: 0 10px 18px 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .brand span {
            display: block;
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 3px;
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s;
        }
        .nav-item:hover, .nav-item.active {
            background: #1e293b;
            color: var(--primary);
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .topbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .role-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .workspace {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
            color: var(--text-main);
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 14px;
            color: var(--primary);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13.5px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .btn {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover { background: var(--primary-hover); color: #fff; }
        .btn-success { background: var(--success); color: #052e16; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 11.5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--bg-dark);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
        }
        .status-pill {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .st-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. SECURE LOGIN SCREEN (RESTRICTED ACCESS) -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>SMART SCHOOL SMIS</h1>
            <p class="subtitle">Strict Administrator-Issued Credentials Portal</p>

            <label>Select Portal Type / Role</label>
            <select id="loginRole" onchange="toggleLoginFields()">
                <option value="SUPER_ADMIN">Administrator (Super Admin)</option>
                <option value="TEACHER">Teacher Portal</option>
                <option value="STUDENT">Student Portal</option>
            </select>

            <label>Username / Registration No (Issued by Admin)</label>
            <input type="text" id="loginUsername" placeholder="e.g. TCH-001 or SMIS-2026-001">

            <label>Password (Generated by Admin)</label>
            <input type="password" id="loginPassword" placeholder="Enter secure password">

            <button class="btn" style="width: 100%; margin-top: 8px;" onclick="handleLogin()">Login to System</button>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 14px; text-align: center;">
                ⚠️ Unregistered users cannot access the system. Contact Admin for credentials.
            </p>
        </div>
    </div>

    <!-- 2. MAIN APP WORKSPACE -->
    <div id="appLayout">
        <aside class="sidebar">
            <div class="brand">
                🎓 SMART SMIS
                <span id="sidebarRoleLabel">PORTAL</span>
            </div>
            <div class="nav-list" id="navMenu"></div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div style="font-weight: 700; font-size: 15px;" id="activeModuleTitle">Dashboard</div>
                <div class="user-pill">
                    <span id="loggedUserDisplay">User</span>
                    <span class="role-tag" id="loggedRoleBadge">ROLE</span>
                    <button class="btn btn-danger btn-sm" onclick="handleLogout()">Logout</button>
                </div>
            </header>

            <div class="workspace" id="workspaceContent"></div>
        </div>
    </div>

    <script>
        // --- SYSTEM USERS DATABASE (MANAGED EXCLUSIVELY BY ADMIN) ---
        let systemUsers = JSON.parse(localStorage.getItem('smart_smis_users')) || {
            SUPER_ADMIN: [{ username: 'admin', password: 'admin123', name: 'Suleiman Salum' }],
            TEACHER: [
                { username: 'tch_victor', password: 'pass123', name: 'Mr. Victor Bwachele' },
                { username: 'tch_nahlat', password: 'pass123', name: 'Ms. Nahlat Khamis' }
            ],
            STUDENT: [
                { username: 'SMIS-2026-001', password: 'stu123', name: 'Asha Salum Ali' }
            ]
        };

        let db = JSON.parse(localStorage.getItem('smart_smis_db')) || {
            students: [
                { regNo: 'SMIS-2026-001', name: 'Asha Salum Ali', class: 'Form 4A', guardian: 'Salum Ali', status: 'Active', feeTotal: 500000, feePaid: 350000 }
            ],
            exams: [
                { studentReg: 'SMIS-2026-001', studentName: 'Asha Salum Ali', subject: 'Accountancy', score: 88, grade: 'A', status: 'Published' }
            ],
            auditLogs: [
                { time: '2026-11-17 08:00', user: 'System', role: 'SUPER_ADMIN', action: 'System Initialized with Secured Credential Verification' }
            ]
        };

        let session = { user: '', role: '', fullName: '' };

        function saveSystem() {
            localStorage.setItem('smart_smis_users', JSON.stringify(systemUsers));
            localStorage.setItem('smart_smis_db', JSON.stringify(db));
        }

        function logAudit(action) {
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            db.auditLogs.unshift({ time: now, user: session.fullName || session.user, role: session.role, action });
            saveSystem();
        }

        // --- STRICT LOGIN & AUTHENTICATION WITH ADMIN-ISSUED CREDENTIALS ---
        function handleLogin() {
            const role = document.getElementById('loginRole').value;
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                alert('Please enter both Username and Password.');
                return;
            }

            // Verify if user exists in the admin-generated database for that specific role
            const userRecord = systemUsers[role]?.find(u => u.username === username && u.password === password);

            if (!userRecord) {
                alert('Access Denied: Invalid credentials or username was not created/registered by the Administrator!');
                return;
            }

            // Successful Login
            session = { user: username, role: role, fullName: userRecord.name };
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appLayout').style.display = 'flex';
            document.getElementById('sidebarRoleLabel').innerText = role.replace('_', ' ');
            document.getElementById('loggedUserDisplay').innerText = userRecord.name;
            document.getElementById('loggedRoleBadge').innerText = role.replace('_', ' ');

            logAudit(`Successfully logged into ${role} portal`);
            buildMenu();
        }

        function handleLogout() {
            logAudit(`Logged out of system`);
            document.getElementById('appLayout').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // --- ROLE-BASED DYNAMIC MENU ---
        function buildMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';

            let modules = [];
            if (session.role === 'SUPER_ADMIN') {
                modules = [
                    { key: 'dashboard', label: '📊 Dashboard' },
                    { key: 'manage_users', label: '⚙️ Manage Users & Credentials' },
                    { key: 'students', label: '👨‍🎓 Student Management' },
                    { key: 'exams', label: '📝 Exams & Results' },
                    { key: 'audit', label: '🛡️ Audit Trail Logs' }
                ];
            } else if (session.role === 'TEACHER') {
                modules = [
                    { key: 'teacher_dashboard', label: '📊 Teacher Overview' },
                    { key: 'enter_marks', label: '✍️ Enter Student Marks' }
                ];
            } else if (session.role === 'STUDENT') {
                modules = [
                    { key: 'student_portal', label: '🎓 My Academic Portal' }
                ];
            }

            modules.forEach((mod, idx) => {
                const item = document.createElement('div');
                item.className = `nav-item ${idx === 0 ? 'active' : ''}`;
                item.innerHTML = `<span>${mod.label}</span>`;
                item.onclick = () => {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    renderModule(mod.key);
                };
                nav.appendChild(item);
            });

            renderModule(modules[0].key);
        }

        // --- MODULE RENDERING & ADMIN USER CREATION ---
        function renderModule(mod) {
            const ws = document.getElementById('workspaceContent');

            if (mod === 'dashboard') {
                document.getElementById('activeModuleTitle').innerText = 'Admin Dashboard';
                ws.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="label">Registered Students</div><div class="value" style="color:var(--primary);">${db.students.length}</div></div>
                        <div class="stat-card"><div class="label">Active Teachers</div><div class="value">${systemUsers.TEACHER.length}</div></div>
                    </div>
                    <div class="card">
                        <h3>Welcome Administrator, ${session.fullName}</h3>
                        <p style="color:var(--text-muted); font-size:13px;">Use the 'Manage Users' section to create usernames and passwords for new teachers and students.</p>
                    </div>
                `;
            } else if (mod === 'manage_users') {
                document.getElementById('activeModuleTitle').innerText = 'Manage Users & Credentials (Admin Only)';
                ws.innerHTML = `
                    <div class="card">
                        <h3>➕ Create User Credentials (Teacher or Student)</h3>
                        <div class="form-grid">
                            <div><label>User Role</label><select id="newRole"><option value="TEACHER">Teacher</option><option value="STUDENT">Student</option></select></div>
                            <div><label>Full Name</label><input type="text" id="newName" placeholder="e.g. John Doe"></div>
                            <div><label>Username / Reg No</label><input type="text" id="newUsername" placeholder="e.g. TCH-002 or SMIS-2026-002"></div>
                            <div><label>Password</label><input type="text" id="newPassword" placeholder="Assign password"></div>
                        </div>
                        <button class="btn btn-success" onclick="createNewUserCredential()">Generate & Save Credentials</button>
                    </div>

                    <div class="card">
                        <h3>📋 List of Authorized System Users</h3>
                        <table>
                            <thead><tr><th>Role</th><th>Full Name</th><th>Username</th><th>Password</th></tr></thead>
                            <tbody>
                                ${Object.entries(systemUsers).flatMap(([r, list]) => list.map(u => `<tr><td><span class="status-pill st-approved">${r}</span></td><td>${u.name}</td><td><strong>${u.username}</strong></td><td><code>${u.password}</code></td></tr>`)).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (mod === 'teacher_dashboard') {
                document.getElementById('activeModuleTitle').innerText = 'Teacher Portal Overview';
                ws.innerHTML = `<div class="card"><h3>Welcome, ${session.fullName}</h3><p style="color:var(--text-muted);">You are successfully logged in using your administrator-assigned credentials. You can enter and update student grades securely.</p></div>`;
            } else if (mod === 'enter_marks') {
                document.getElementById('activeModuleTitle').innerText = 'Enter Student Marks';
                ws.innerHTML = `
                    <div class="card">
                        <h3>✍️ Submit Exam Marks</h3>
                        <label>Student</label>
                        <select id="mStudent">${db.students.map(s => `<option value="${s.regNo}|${s.name}">${s.regNo} - ${s.name}</option>`).join('')}</select>
                        <label>Subject</label><input type="text" id="mSubject" placeholder="Subject Name">
                        <label>Marks (0-100)</label><input type="number" id="mScore" placeholder="85">
                        <button class="btn" onclick="teacherSubmitMarks()">Submit Marks</button>
                    </div>
                `;
            } else if (mod === 'student_portal') {
                document.getElementById('activeModuleTitle').innerText = 'Student Academic & Fee Portal';
                const studentData = db.students.find(s => s.regNo === session.user) || db.students[0];
                ws.innerHTML = `
                    <div class="card">
                        <h3>🎓 Welcome, ${session.fullName} (Reg: ${studentData.regNo})</h3>
                        <p style="color:var(--text-muted);">Class: <strong>${studentData.class}</strong> | Fee Balance: <strong style="color:var(--danger);">${(studentData.feeTotal - studentData.feePaid).toLocaleString()} TZS</strong></p>
                    </div>
                    <div class="card">
                        <h3>📄 My Exam Results</h3>
                        <table>
                            <thead><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Status</th></tr></thead>
                            <tbody>
                                ${db.exams.filter(e => e.studentReg === studentData.regNo).map(e => `<tr><td>${e.subject}</td><td>${e.score}%</td><td><strong>${e.grade}</strong></td><td>Official</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (mod === 'audit') {
                document.getElementById('activeModuleTitle').innerText = 'System Audit Trail';
                ws.innerHTML = `
                    <div class="card">
                        <h3>🛡️ Immutable Logs</h3>
                        <table>
                            <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th></tr></thead>
                            <tbody>${db.auditLogs.map(l => `<tr><td>${l.time}</td><td>${l.user}</td><td>${l.role}</td><td>${l.action}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                `;
            } else {
                ws.innerHTML = `<div class="card"><h3>Module Active</h3></div>`;
            }
        }

        // --- ADMIN ACTION TO CREATE CREDENTIALS ---
        function createNewUserCredential() {
            const role = document.getElementById('newRole').value;
            const name = document.getElementById('newName').value.trim();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();

            if (!name || !username || !password) {
                alert('Please fill out all fields.');
                return;
            }

            // Check if username already exists
            const exists = Object.values(systemUsers).flat().some(u => u.username === username);
            if (exists) {
                alert('Username already exists! Choose another username.');
                return;
            }

            systemUsers[role].push({ username, password, name });
            
            // If student, also add to student registry if not present
            if (role === 'STUDENT') {
                db.students.push({ regNo: username, name: name, class: 'Form 1A', guardian: 'Parent', status: 'Active', feeTotal: 500000, feePaid: 0 });
            }

            saveSystem();
            logAudit(`Admin created login credentials for ${role}: ${name} (${username})`);
            alert(`Credentials successfully generated for ${name}! They can now log in using Username: ${username} and Password: ${password}.`);
            renderModule('manage_users');
        }

        function teacherSubmitMarks() {
            const st = document.getElementById('mStudent').value.split('|');
            const subject = document.getElementById('mSubject').value.trim();
            const score = parseInt(document.getElementById('mScore').value);
            if (!subject || isNaN(score)) { alert('Enter valid subject and score.'); return; }

            const grade = score >= 80 ? 'A' : (score >= 70 ? 'B' : (score >= 60 ? 'C' : 'D'));
            db.exams.push({ studentReg: st[0], studentName: st[1], subject, score, grade, status: 'Published' });
            saveSystem();
            logAudit(`Teacher ${session.fullName} entered marks for ${st[1]}`);
            alert('Marks submitted successfully!');
        }
    </script>
</body>
</html>
